services:
  web:
    image: ${DOCKERHUB_USER:-local}/plane-frontend:${APP_RELEASE:-latest}
    build:
      context: ../../../
      dockerfile: apps/web/Dockerfile.web

  space:
    image: ${DOCKERHUB_USER:-local}/plane-space:${APP_RELEASE:-latest}
    build:
      context: ../../../
      dockerfile: apps/space/Dockerfile.space

  admin:
    image: ${DOCKERHUB_USER:-local}/plane-admin:${APP_RELEASE:-latest}
    build:
      context: ../../../
      dockerfile: apps/admin/Dockerfile.admin

  live:
    image: ${DOCKERHUB_USER:-local}/plane-live:${APP_RELEASE:-latest}
    build:
      context: ../../../
      dockerfile: apps/live/Dockerfile.live

  api:
    image: ${DOCKERHUB_USER:-local}/plane-backend:${APP_RELEASE:-latest}
    build:
      context: ../../../apps/api
      dockerfile: Dockerfile.api

  proxy:
    image: ${DOCKERHUB_USER:-local}/plane-proxy:${APP_RELEASE:-latest}
    build:
      context: ../../../apps/proxy
      dockerfile: Dockerfile.ce
    environment:
      # /<bucket>/* goes to the MinIO the API uses; with USE_MINIO=1 files are served through this proxy,
      # on whichever address (LAN or public domain) the user opened Plane with
      MINIO_UPSTREAM: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
    # HTTP only: TLS ends in front of Plane (Cloudflare Tunnel), so 443 is not published
    ports: !override
      - target: 80
        published: ${LISTEN_HTTP_PORT:-80}
        protocol: tcp
        mode: host

  # same backend image as api, so they run this checkout's code instead of pulling makeplane/plane-backend
  worker:
    image: ${DOCKERHUB_USER:-local}/plane-backend:${APP_RELEASE:-latest}

  beat-worker:
    image: ${DOCKERHUB_USER:-local}/plane-backend:${APP_RELEASE:-latest}

  migrator:
    image: ${DOCKERHUB_USER:-local}/plane-backend:${APP_RELEASE:-latest}
